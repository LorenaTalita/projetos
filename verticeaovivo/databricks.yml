# Declarative Automation Bundle — Vértice Tecnologia
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vertice
  uuid: e3c471c8-ec34-43aa-8447-29053d700746

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations.
variables:
  catalog:
    description: O catálogo do Unity Catalog
    default: lakehouse_vertice
  warehouse_id:
    description: ID do SQL Warehouse para sql_tasks
    default: e05f08da0ff4277b
  s3_access_key_id:
    description: chave do data lake (o valor fica fora do Git)
  s3_secret_access_key:
    description: chave do data lake (o valor fica fora do Git)

targets:
  dev:
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-a1fc961c-9e28.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-a1fc961c-9e28.cloud.databricks.com
      root_path: /Workspace/Users/lorena.talitaa@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: lorena.talitaa@gmail.com
        level: CAN_MANAGE
