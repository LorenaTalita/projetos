# Job vertice_farol — Orquestração completa da Torre de Controle (6 tarefas):
# 1. ingestao_feriados   (notebook_task) : coleta feriados nacionais da BrasilAPI para bronze.feriados
# 2. ingestao_data_lake  (notebook_task) : baixa arquivos do Supabase S3 com boto3 e recria as 9 tabelas bronze
#    (1 e 2 rodam em paralelo no início)
# 3. conferencia_bronze  (sql_task)      : valida a contagem das 9 tabelas bronze (seed 42) após as duas ingestões
# 4. medalhao            (pipeline_task) : atualiza o pipeline Lakeflow vertice_medalhao (7 tabelas silver + 3 gold)
# 5. testes_de_qualidade (sql_task)      : executa os 10 testes de integridade e reconciliação bronze/silver/gold
# 6. status_com_ia       (sql_task)      : classifica e extrai bloqueios de status_semanal em gold.status_estruturado
#    (5 e 6 rodam em paralelo depois de medalhao)

resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      # Toda segunda às 6h (America/Sao_Paulo). No target dev fica pausado pelo preset.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      tasks:
        - task_key: ingestao_feriados
          notebook_task:
            notebook_path: ../src/ingestao/Ingestao_API.ipynb
            source: WORKSPACE
          timeout_seconds: 0
        - task_key: ingestao_data_lake
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_DEFAULT_REGION: us-east-2
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://dtukdfwkxhhshyyitshh.storage.supabase.co/storage/v1/s3
            notebook_path: ../src/ingestao/02_ingestao_boto3_gabarito.ipynb
            source: WORKSPACE
          timeout_seconds: 0
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql
            warehouse_id: ${var.warehouse_id}
          timeout_seconds: 0
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}
          timeout_seconds: 0
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            file:
              path: ../src/testes/testes.sql
            warehouse_id: ${var.warehouse_id}
          timeout_seconds: 0
        - task_key: status_com_ia
          depends_on:
            - task_key: medalhao
          sql_task:
            file:
              path: ../src/ia/status_estruturado.sql
            warehouse_id: ${var.warehouse_id}
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
