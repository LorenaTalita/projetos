resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      # Toda segunda às 6h (CLAUDE.md §4). Fica pausado até o prompt 4 ligar o agendamento.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      tasks:
        - task_key: ingestao_feriados
          notebook_task:
            notebook_path: ../src/ingestao/Ingestao_API.ipynb
            source: WORKSPACE
          timeout_seconds: 0
        - task_key: ingestao_data_lake
          depends_on:
            - task_key: ingestao_feriados
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_DEFAULT_REGION: us-east-2
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://dtukdfwkxhhshyyitshh.storage.supabase.co/storage/v1/s3
            notebook_path: ../src/ingestao/02_ingestao_boto3_gabarito.ipynb
            source: WORKSPACE
          timeout_seconds: 0
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql
            warehouse_id: ${var.warehouse_id}
          timeout_seconds: 0
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}
          timeout_seconds: 0
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            file:
              path: ../src/testes/testes.sql
            warehouse_id: ${var.warehouse_id}
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
